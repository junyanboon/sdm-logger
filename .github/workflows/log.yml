name: Log SDM reading

on:
  # PRIMARY trigger: cron-job.org POSTs to this workflow's /dispatches endpoint
  # hourly at :05 America/Toronto (job: "sdm-logger hourly trigger"). GitHub's own
  # cron on low-traffic repos is throttled/best-effort, so it is only the BACKUP
  # below — sparse on purpose to avoid double readings in the same hour.
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Bypass the Toronto time gate
        required: false
        type: boolean
        default: false

concurrency:
  group: log
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Gate on setup
        id: setup
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::notice::NOTION_TOKEN is not configured; skipping SDM logging."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log SDM reading
        if: steps.setup.outputs.ready == 'true'
        env:
          SDM_PROJECT_ID: ${{ secrets.SDM_PROJECT_ID }}
          SDM_CLIENT_ID: ${{ secrets.SDM_CLIENT_ID }}
          SDM_CLIENT_SECRET: ${{ secrets.SDM_CLIENT_SECRET }}
          SDM_REFRESH_TOKEN: ${{ secrets.SDM_REFRESH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python3 log_reading.py
